name: Qwen4 reusable evaluation

on:
  workflow_call:
    inputs:
      harness_sha:
        description: "Immutable SGLang commit containing this trusted harness"
        required: true
        type: string
      profile:
        type: string
        default: full
      cases:
        type: string
        default: ""
      base_image:
        type: string
        default: ""
      sglang_ref:
        type: string
        default: ""
      aiter_ref:
        type: string
        default: ""
      pyhip_ref:
        type: string
        default: ""
      gsm8k_num_examples:
        type: string
        default: ""
      pr_number:
        type: string
        default: ""
      candidate_sha:
        type: string
        default: ""
    secrets:
      DOCKER_PASSWORD:
        required: false

permissions:
  contents: read
  pull-requests: read
  issues: read
  actions: read
  statuses: write

jobs:
  prepare:
    name: Qwen4 plan and authorization
    runs-on: ubuntu-latest
    outputs:
      enabled: ${{ steps.plan.outputs.enabled }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: apinge/sglang
          ref: ${{ inputs.harness_sha }}
          persist-credentials: false
      - name: Validate harness contracts
        run: |
          python3 -m venv "$RUNNER_TEMP/qwen4-tests"
          "$RUNNER_TEMP/qwen4-tests/bin/pip" install pytest==8.3.5
          "$RUNNER_TEMP/qwen4-tests/bin/python" -m pytest evaluation/qwen4/tests -q
      - name: Find the original plan, including expired artifacts
        id: previous_plan
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' | python3 evaluation/qwen4/ci_artifacts.py --find qwen4-plan
      - name: Restore the original plan on a workflow retry
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.previous_plan.outputs.name != ''
        with:
          name: qwen4-plan
          path: qwen4-plan
      - name: Authorize and resolve one immutable source combination
        id: plan
        env:
          GH_TOKEN: ${{ github.token }}
          HARNESS_SHA: ${{ inputs.harness_sha }}
          QWEN4_CI_LABEL: ${{ vars.QWEN4_CI_LABEL || 'run-qwen4-ci' }}
          INPUT_PROFILE: ${{ inputs.profile }}
          INPUT_CASES: ${{ inputs.cases }}
          INPUT_BASE_IMAGE: ${{ inputs.base_image }}
          INPUT_SGLANG_REF: ${{ inputs.sglang_ref }}
          INPUT_AITER_REF: ${{ inputs.aiter_ref }}
          INPUT_PYHIP_REF: ${{ inputs.pyhip_ref }}
          INPUT_EXAMPLES: ${{ inputs.gsm8k_num_examples }}
          INPUT_PR_NUMBER: ${{ inputs.pr_number }}
          INPUT_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: python3 evaluation/qwen4/ci_entry.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always() && steps.plan.outputs.enabled == 'true' && steps.plan.outputs.reused != 'true'
        with:
          name: qwen4-plan
          path: qwen4-plan/manifest.json
          if-no-files-found: error
          retention-days: 30

  gpu:
    name: Qwen4 six-case MI308X evaluation
    needs: prepare
    if: needs.prepare.outputs.enabled == 'true'
    runs-on: ${{ fromJSON(vars.QWEN4_RUNNER_LABELS || '["self-hosted","linux","mi308x"]') }}
    timeout-minutes: 1440
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: apinge/sglang
          ref: ${{ inputs.harness_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qwen4-plan
          path: qwen4-plan
      - name: Prepare isolated Docker registry configuration
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
          DOCKER_USERNAME: ${{ vars.QWEN4_DOCKER_USERNAME || 'alishared' }}
        run: |
          set -euo pipefail
          config_dir=$(mktemp -d "$RUNNER_TEMP/qwen4-docker.XXXXXX")
          echo "DOCKER_CONFIG=$config_dir" >> "$GITHUB_ENV"
          if [ -n "$DOCKER_PASSWORD" ]; then
            printf '%s' "$DOCKER_PASSWORD" | docker --config "$config_dir" login -u "$DOCKER_USERNAME" --password-stdin
          fi
      - name: Find the original image lock, including expired artifacts
        id: previous_image
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[].name' | python3 evaluation/qwen4/ci_artifacts.py --find qwen4-image-lock
      - name: Restore original image identity for a failed-job retry
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.previous_image.outputs.name != ''
        with:
          name: qwen4-image-lock
          path: qwen4-image-lock
      - name: Build once and evaluate three target containers
        env:
          MODELS_ROOT: ${{ vars.QWEN4_MODELS_ROOT || '/raid/models' }}
          GSM8K_PATH: ${{ vars.QWEN4_GSM8K_PATH || '/raid/models/benchmark_datasets/gsm8k/test.jsonl' }}
          SHAREGPT_PATH: ${{ vars.QWEN4_SHAREGPT_PATH || '/raid/models/benchmark_datasets/ShareGPT_V3_unfiltered_cleaned_split.json' }}
        run: |
          retry_args=()
          if [ -f qwen4-image-lock/image-lock.json ]; then
            retry_args=(--image-lock qwen4-image-lock/image-lock.json)
          fi
          python3 evaluation/qwen4/run.py execute \
            --plan qwen4-plan/manifest.json --output qwen4-results \
            --models-root "$MODELS_ROOT" --gsm8k "$GSM8K_PATH" --sharegpt "$SHAREGPT_PATH" "${retry_args[@]}"
      - name: Preserve partial summary
        if: always()
        run: |
          if [ -f qwen4-results/summary.md ]; then
            cat qwen4-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen4-image-lock
          path: qwen4-results/image-lock.json
          if-no-files-found: ignore
          overwrite: true
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: qwen4-results-${{ github.run_attempt }}
          path: |
            qwen4-results/**
            !qwen4-results/**/cache/**
          if-no-files-found: error
          retention-days: 30
      - name: Remove this job's registry configuration
        if: always()
        run: |
          if [[ "${DOCKER_CONFIG:-}" == "$RUNNER_TEMP"/qwen4-docker.* ]]; then
            rm -rf -- "$DOCKER_CONFIG"
          fi

  report:
    name: Qwen4 CI Report
    needs: [prepare, gpu]
    if: always() && needs.prepare.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: apinge/sglang
          ref: ${{ inputs.harness_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        continue-on-error: true
        with:
          name: qwen4-plan
          path: qwen4-plan
      - name: Find available results from this run
        id: results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts?per_page=100" \
            --jq '.artifacts[] | select(.expired == false) | .name' \
            | python3 evaluation/qwen4/ci_artifacts.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        if: steps.results.outputs.name != ''
        continue-on-error: true
        with:
          name: ${{ steps.results.outputs.name }}
          path: qwen4-results
      - name: Publish all expected cases and return aggregate status
        if: always()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GPU_JOB_RESULT: ${{ needs.gpu.result }}
          GH_TOKEN: ${{ github.token }}
        run: |
          status=0
          if [ ! -f qwen4-plan/manifest.json ]; then
            echo '## Qwen4 CI: preparation failed' >> "$GITHUB_STEP_SUMMARY"
            echo 'The run plan is unavailable. No model result is verified; inspect the preparation job logs.' >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [ "$GPU_JOB_RESULT" != success ]; then
            mkdir -p qwen4-results
            printf '%s\n' "$GPU_JOB_RESULT" > qwen4-results/github-job-failure.txt
          fi
          python3 evaluation/qwen4/report.py --plan qwen4-plan/manifest.json \
            --output qwen4-results --artifact-url "$RUN_URL" || status=$?
          if [ -f qwen4-results/summary.md ]; then
            cat qwen4-results/summary.md >> "$GITHUB_STEP_SUMMARY"
          fi
          result_state=failure
          if [ "$status" -eq 0 ]; then result_state=success; fi
          python3 evaluation/qwen4/ci_status.py --plan qwen4-plan/manifest.json --state "$result_state"
          exit "$status"
