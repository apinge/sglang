name: SGLang Qwen3.5 Workflow

on:
  pull_request:
    branches:
      - qwen3_5_v0.5.15_dflash
  schedule:
    # Daily at 04:00 AM Beijing time (20:00 UTC)
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      run_mode:
        description: "Which workload to run"
        required: true
        default: "accuracy"
        type: choice
        options:
          - accuracy
          - benchmark
      benchmark_target:
        description: "Which load tests to run when run_mode=benchmark"
        required: false
        default: "all"
        type: choice
        options:
          - all
          - load_test
          - pure_text
          - concurrency
          - request_rate
      model_list:
        description: 'Model list to run on MI308 (JSON array format, default: ["Qwen3.5-27B-PTPC-compressor","Qwen3.5-35B-A3B-PTPC-compressor","Qwen3.5-397B-A17B-PTPC-FP8"])'
        required: false
        default: '["Qwen3.5-27B-PTPC-compressor","Qwen3.5-35B-A3B-PTPC-compressor","Qwen3.5-397B-A17B-PTPC-FP8"]'
      image:
        description: 'Optional image override for the benchmark'
        required: false
        default: ""

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  SGLANG_BENCHMARK_PORT: "8080"
  HOST_MODELS_ROOT: /raid/models
  CONTAINER_MODELS_ROOT: /models
  SGLANG_BENCHMARK_EXAMPLE_ROOT: /models/benchamark_example
  SGLANG_BENCHMARK_RESULTS_DIR: benchmark_test_results
  SGLANG_BENCHMARK_DATASETS_ROOT: /models/benchmark_datasets
  SGLANG_BENCHMARK_SHAREGPT_DATASET_PATH: /models/benchmark_datasets/ShareGPT_V3_unfiltered_cleaned_split.json
  TVM_FFI_DISABLE_TORCH_C_DLPACK: "1"
  SGLANG_GITHUB_REPO_URL: ${{ github.event.pull_request.head.repo.clone_url || 'https://github.com/apinge/sglang.git' }}
  SGLANG_GITHUB_COMMIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  prepare-qwen35-matrix:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.generate.outputs.matrix }}
    steps:
      - name: Generate Qwen3.5 matrix
        id: generate
        env:
          EVENT_NAME: ${{ github.event_name }}
          RUN_MODE: ${{ github.event.inputs.run_mode || '' }}
          BENCHMARK_TARGET_INPUT: ${{ github.event.inputs.benchmark_target || 'all' }}
          MODEL_LIST_JSON: ${{ github.event.inputs.model_list || '["Qwen3.5-27B-PTPC-compressor","Qwen3.5-35B-A3B-PTPC-compressor","Qwen3.5-397B-A17B-PTPC-FP8"]' }}
        run: |
          python3 <<'PY'
          import json
          import os
          from pathlib import Path

          event_name = os.environ["EVENT_NAME"]
          run_mode = os.environ["RUN_MODE"]
          benchmark_target = os.environ["BENCHMARK_TARGET_INPUT"] or "all"
          models = json.loads(os.environ["MODEL_LIST_JSON"])

          matrix_entries = []
          slot = 0

          if event_name == "schedule" or (
              event_name == "workflow_dispatch" and run_mode == "benchmark"
          ):
              if benchmark_target in {"all", "load_test"}:
                  targets = ["load_test"]
              elif benchmark_target in {"pure_text", "concurrency", "request_rate"}:
                  targets = [benchmark_target]
              else:
                  raise SystemExit(f"Unknown benchmark_target: {benchmark_target}")

              for model in models:
                  for target in targets:
                      matrix_entries.append(
                          {
                              "model": model,
                              "job_mode": "benchmark",
                              "benchmark_target": target,
                              "port": str(8080 + slot),
                              "slot": f"{slot}-{target}",
                          }
                      )
                      slot += 1
          else:
              for model in models:
                  matrix_entries.append(
                      {
                          "model": model,
                          "job_mode": "accuracy",
                          "benchmark_target": "accuracy",
                          "port": str(8080 + slot),
                          "slot": f"{slot}-accuracy",
                      }
                  )
                  slot += 1

          matrix = {"include": matrix_entries}
          github_output = Path(os.environ["GITHUB_OUTPUT"])
          with github_output.open("a", encoding="utf-8") as f:
              f.write(f"matrix={json.dumps(matrix)}\n")
          PY

  qwen35:
    needs: prepare-qwen35-matrix
    name: qwen35 (${{ matrix.model }}, ${{ matrix.benchmark_target }})
    runs-on: self-hosted
    timeout-minutes: 420
    env:
      BENCHMARK_TARGET: ${{ matrix.benchmark_target }}
      SGLANG_BENCHMARK_PORT: ${{ matrix.port }}
      CONTAINER_NAME: sglang_test_${{ github.run_id }}_${{ matrix.slot }}
      LOCAL_IMAGE_NAME: sglang_test:ci-${{ github.run_id }}-${{ matrix.slot }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.prepare-qwen35-matrix.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Resolve model config
        run: |
          set -euo pipefail

          host_models_root="${{ env.HOST_MODELS_ROOT }}"
          container_models_root="${{ env.CONTAINER_MODELS_ROOT }}"
          model_name='${{ matrix.model }}'
          workflow_image='${{ github.event.inputs.image || '' }}'
          case "${model_name}" in
            offical_qwen3p5_397B_ptpc|Qwen3.5-397B-A17B-PTPC-FP8)
              model_dir="offical_qwen3p5_397B_ptpc"
              model_image="rocm/ali-private:ubuntu22.04_rocm7.2.0.43_cp310_torch2.9.1_sglang_3038fa5_aiter_ea051b0_qwen3_5_20260710_v2"
              model_tp="8"
              model_vlm_cache_size_mb="8192"
              ;;
            Qwen3.5-27B-PTPC-compressor)
              model_dir="Qwen3.5-27B-PTPC-compressor"
              model_image="rocm/ali-private:ubuntu22.04_rocm7.2.0.43_cp310_torch2.9.1_sglang_3038fa5_aiter_ea051b0_qwen3_5_20260710_v2"
              model_tp="1"
              model_vlm_cache_size_mb="8192"
              ;;
            Qwen3.5-35B-A3B-PTPC-compressor)
              model_dir="Qwen3.5-35B-A3B-PTPC-compressor"
              model_image="rocm/ali-private:ubuntu22.04_rocm7.2.0.43_cp310_torch2.9.1_sglang_3038fa5_aiter_ea051b0_qwen3_5_20260710_v2"
              model_tp="4"
              model_vlm_cache_size_mb="8192"
              ;;
            *)
              echo "Unknown model_name: ${model_name}"
              exit 1
              ;;
          esac

          model_path_host="${host_models_root}/${model_dir}"
          model_path="${container_models_root}/${model_dir}"

          if [ -n "${workflow_image}" ]; then
            model_image="${workflow_image}"
          fi

          echo "MODEL_NAME=${model_name}" >> "${GITHUB_ENV}"
          echo "MODEL_DIR=${model_dir}" >> "${GITHUB_ENV}"
          echo "MODEL_PATH=${model_path}" >> "${GITHUB_ENV}"
          echo "MODEL_PATH_HOST=${model_path_host}" >> "${GITHUB_ENV}"
          echo "MODEL_IMAGE=${model_image}" >> "${GITHUB_ENV}"
          echo "MODEL_TP=${model_tp}" >> "${GITHUB_ENV}"
          echo "MODEL_VLM_CACHE_SIZE_MB=${model_vlm_cache_size_mb}" >> "${GITHUB_ENV}"
          echo "Resolved model_name: ${model_name}"
          echo "Resolved model_dir: ${model_dir}"
          echo "Resolved model_path (container): ${model_path}"
          echo "Resolved model_path (host): ${model_path_host}"
          echo "Resolved model_image: ${model_image}"
          echo "Resolved model_tp: ${model_tp}"
          echo "Resolved model_vlm_cache_size_mb: ${model_vlm_cache_size_mb}"

      - name: Docker login (optional)
        env:
          DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
        run: |
          if [ -z "${DOCKER_PASSWORD}" ]; then
            echo "Skipping Docker login (DOCKER_PASSWORD not available; using local cached image if present)"
            exit 0
          fi
          for attempt in 1 2 3; do
            if echo "$DOCKER_PASSWORD" | docker login -u alishared --password-stdin; then
              echo "Docker login succeeded on attempt ${attempt}"
              exit 0
            fi
            echo "Docker login attempt ${attempt} failed"
            if [ "${attempt}" != 3 ]; then
              sleep 10
            fi
          done
          echo "Docker login failed after 3 attempts"
          exit 1

      - name: Prepare SGLang image
        run: |
          set -euo pipefail

          if docker image inspect "${MODEL_IMAGE}" >/dev/null 2>&1; then
            echo "Using local image:"
            docker image ls "${MODEL_IMAGE}"
            exit 0
          fi

          echo "Local image not found, trying to pull: ${MODEL_IMAGE}"

          pulled=0
          for i in {1..3}; do
            if docker pull "${MODEL_IMAGE}"; then
              pulled=1
              break
            fi

            if [ "${i}" -lt 3 ]; then
              echo "docker pull failed, retrying ($i/3)..."
              sleep 5
            fi
          done

          if [ "${pulled}" -ne 1 ]; then
            echo "Failed to find local image and docker pull failed: ${MODEL_IMAGE}"
            echo "Available local images:"
            docker image ls --format '{{.Repository}}:{{.Tag}}\t{{.ID}}\t{{.CreatedSince}}' | sort || true
            exit 1
          fi

          echo "Pulled image:"
          docker image ls "${MODEL_IMAGE}"

      - name: Validate model path
        run: |
          set -euo pipefail

          if [ -z "${MODEL_NAME:-}" ] || [ -z "${MODEL_PATH:-}" ] || [ -z "${MODEL_PATH_HOST:-}" ] || [ -z "${MODEL_IMAGE:-}" ] || [ -z "${MODEL_TP:-}" ] || [ -z "${MODEL_VLM_CACHE_SIZE_MB:-}" ]; then
            echo "Model config is not set correctly."
            exit 1
          fi

          if [ ! -d "${MODEL_PATH_HOST}" ]; then
            echo "Expected model directory not found on host: ${MODEL_PATH_HOST}"
            echo "Container path will be: ${MODEL_PATH}"
            ls -lah "${{ env.HOST_MODELS_ROOT }}"
            exit 1
          fi

          ls -lah "${{ env.HOST_MODELS_ROOT }}"
          du -sh "${MODEL_PATH_HOST}"

      - name: Validate benchmark datasets
        if: ${{ matrix.job_mode == 'accuracy' || matrix.job_mode == 'benchmark' }}
        run: |
          set -euo pipefail

          dataset_path="${{ env.HOST_MODELS_ROOT }}/benchmark_datasets/ShareGPT_V3_unfiltered_cleaned_split.json"
          if [ ! -f "${dataset_path}" ]; then
            echo "Expected ShareGPT dataset not found on host: ${dataset_path}"
            echo "Container path will be: ${{ env.SGLANG_BENCHMARK_SHAREGPT_DATASET_PATH }}"
            echo "Prepare it once on the runner with:"
            echo "  bash scripts/ci/prepare_benchmark_datasets.sh ${{ env.HOST_MODELS_ROOT }}/benchmark_datasets"
            exit 1
          fi

          python3 - <<'PY' "${dataset_path}"
          import json
          import sys
          from pathlib import Path

          path = Path(sys.argv[1])
          json.loads(path.read_text(encoding="utf-8"))
          print(f"Validated ShareGPT dataset: {path} ({path.stat().st_size} bytes)")
          PY

      - name: Validate benchmark scripts
        if: ${{ matrix.job_mode == 'benchmark' && (matrix.benchmark_target == 'load_test' || matrix.benchmark_target == 'concurrency' || matrix.benchmark_target == 'request_rate') }}
        run: |
          set -euo pipefail

          benchmark_example_host="${{ env.HOST_MODELS_ROOT }}/benchamark_example"
          if [ "${{ matrix.benchmark_target }}" = "load_test" ]; then
            benchmark_targets=(concurrency request_rate)
          else
            benchmark_targets=("${{ matrix.benchmark_target }}")
          fi

          for target in "${benchmark_targets[@]}"; do
            script_path="${benchmark_example_host}/${target}/run.sh"
            if [ ! -f "${script_path}" ]; then
              echo "Expected benchmark script not found on host: ${script_path}"
              echo "Container path will be: ${{ env.SGLANG_BENCHMARK_EXAMPLE_ROOT }}/${target}/run.sh"
              exit 1
            fi
          done

          ls -lah "${benchmark_example_host}"

      - name: Generate Dockerfile
        run: |
          cat <<'AITER_SCRIPT' > aiter_update.sh
          #!/bin/bash
          set -euo pipefail

          AITER_DIR="${AITER_DIR:-/opt/aiter}"
          AITER_BRANCH="${AITER_BRANCH:-Qwen3.5_dev}"
          AITER_REMOTE="${AITER_REMOTE:-origin}"

          if [[ ! -d "${AITER_DIR}/.git" ]]; then
            echo "ERROR: ${AITER_DIR} is not a git repository"
            exit 1
          fi

          cd "${AITER_DIR}"

          COMPOSABLE_KERNEL_PATH="${AITER_DIR}/3rdparty/composable_kernel"
          COMPOSABLE_KERNEL_BACKUP=""

          echo "========== UPDATING AITER =========="
          echo "Repository: ${AITER_DIR}"
          echo "Remote: ${AITER_REMOTE}"
          echo "Branch: ${AITER_BRANCH}"
          echo "Preserving local changes in: ${COMPOSABLE_KERNEL_PATH}"

          if [[ -d "${COMPOSABLE_KERNEL_PATH}" ]]; then
            COMPOSABLE_KERNEL_BACKUP="$(mktemp -d)"
            echo "=== Backing up composable_kernel before git pull ==="
            cp -a "${COMPOSABLE_KERNEL_PATH}" "${COMPOSABLE_KERNEL_BACKUP}/"
          fi

          echo
          echo "=== Aiter before update ==="
          git rev-parse HEAD
          git log -1 --oneline || true

          git fetch "${AITER_REMOTE}" "${AITER_BRANCH}"
          git checkout "${AITER_BRANCH}"
          git pull --ff-only "${AITER_REMOTE}" "${AITER_BRANCH}"

          if [[ -n "${COMPOSABLE_KERNEL_BACKUP}" && -d "${COMPOSABLE_KERNEL_BACKUP}/composable_kernel" ]]; then
            echo
            echo "=== Restoring local composable_kernel after git pull ==="
            rm -rf "${COMPOSABLE_KERNEL_PATH}"
            mkdir -p "${AITER_DIR}/3rdparty"
            cp -a "${COMPOSABLE_KERNEL_BACKUP}/composable_kernel" "${COMPOSABLE_KERNEL_PATH}"
            rm -rf "${COMPOSABLE_KERNEL_BACKUP}"
          fi

          echo
          echo "=== Aiter after update ==="
          git rev-parse HEAD
          git log -1 --oneline

          echo
          echo "=== Clearing aiter JIT cache ==="
          rm -rf /opt/aiter/aiter/jit/build
          shopt -s nullglob
          rm -f /opt/aiter/aiter/jit/*.so
          shopt -u nullglob
          rm -rf "${HOME}/.aiter"

          echo
          echo "=== Reinstalling aiter (editable) ==="
          pip install -e .
          pip show amd-aiter || true

          echo "Aiter update complete."
          AITER_SCRIPT
          chmod +x aiter_update.sh

          cat <<EOF > Dockerfile.mod
          FROM ${MODEL_IMAGE}
          ENV GPU_ARCHS="gfx942"
          ENV PYTORCH_ROCM_ARCH="gfx942"

          COPY aiter_update.sh /tmp/aiter_update.sh
          RUN echo "=== Aiter version in base image ===" && pip show amd-aiter || true
          RUN bash /tmp/aiter_update.sh && rm -f /tmp/aiter_update.sh

          RUN echo "=== sgl-kernel version before installation ===" && pip show sgl-kernel || true
          RUN echo "=== sglang version before installation ===" && pip show sglang || true
          RUN pip uninstall -y sgl-kernel sglang || true
          RUN pip install "pybind11>=3.0.1" "transformers>=4.57.0" "oss2"
          RUN git clone ${SGLANG_GITHUB_REPO_URL} /sglang-checkout && \
              cd /sglang-checkout && \
              git checkout ${SGLANG_GITHUB_COMMIT_SHA} && \
              git rev-parse HEAD && \
              pip install --upgrade pip && \
              cd sgl-kernel && \
              python3 setup_rocm.py install && \
              cd .. && \
              rm -rf python/pyproject.toml && \
              mv python/pyproject_other.toml python/pyproject.toml && \
              pip install -e "python[all_hip]"

          RUN echo "=== sgl-kernel version after installation ===" && pip show sgl-kernel || true
          RUN echo "=== sglang version after installation ===" && pip show sglang || true
          EOF

      - name: Show Dockerfile
        run: |
          cat Dockerfile.mod

      - name: Build Docker image
        run: |
          docker build --pull=false --no-cache --network=host -t "${LOCAL_IMAGE_NAME}" -f Dockerfile.mod .

      - name: Start CI container
        run: |
          echo "Clean up containers..."
          docker ps -aq -f name="${CONTAINER_NAME}" | xargs -r docker stop | xargs -r docker rm

          if [ -f "/etc/podinfo/gha-render-devices" ]; then
            DEVICE_FLAG=$(cat /etc/podinfo/gha-render-devices)
          else
            DEVICE_FLAG="--device /dev/dri"
          fi

          echo "Starting container: ${LOCAL_IMAGE_NAME}"
          docker run -dt --user root --device=/dev/kfd $DEVICE_FLAG \
            --ulimit nofile=65536:65536 \
            --ipc=host --group-add video \
            --shm-size 32g \
            --network=host \
            --privileged \
            --cap-add=SYS_PTRACE \
            -e SGLANG_VLM_CACHE_SIZE_MB=${MODEL_VLM_CACHE_SIZE_MB} \
            -e SGLANG_BENCHMARK_PORT=${{ env.SGLANG_BENCHMARK_PORT }} \
            -e SGLANG_BENCHMARK_EXAMPLE_ROOT=${{ env.SGLANG_BENCHMARK_EXAMPLE_ROOT }} \
            -e SGLANG_BENCHMARK_RESULTS_DIR=${{ env.SGLANG_BENCHMARK_RESULTS_DIR }} \
            -e SGLANG_BENCHMARK_DATASETS_ROOT=${{ env.SGLANG_BENCHMARK_DATASETS_ROOT }} \
            -e SGLANG_BENCHMARK_SHAREGPT_DATASET_PATH=${{ env.SGLANG_BENCHMARK_SHAREGPT_DATASET_PATH }} \
            -e TVM_FFI_DISABLE_TORCH_C_DLPACK=${{ env.TVM_FFI_DISABLE_TORCH_C_DLPACK }} \
            -v ${{ env.HOST_MODELS_ROOT }}:${{ env.CONTAINER_MODELS_ROOT }}:ro \
            --security-opt seccomp=unconfined \
            -w /sglang-checkout \
            --name "${CONTAINER_NAME}" \
            "${LOCAL_IMAGE_NAME}"

      - name: Show installed versions
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc "pip show oss2 || true"
          docker exec "${CONTAINER_NAME}" bash -lc "pip show amd-aiter || true"
          docker exec "${CONTAINER_NAME}" bash -lc "pip show sgl-kernel || true"
          docker exec "${CONTAINER_NAME}" bash -lc "pip show sglang || true"

      - name: Show model and shared memory status
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc "df -h /dev/shm"
          docker exec "${CONTAINER_NAME}" bash -lc "ls -lah ${{ env.CONTAINER_MODELS_ROOT }}"
          docker exec "${CONTAINER_NAME}" bash -lc "du -sh \"${MODEL_PATH}\""

      - name: Launch the server
        timeout-minutes: 60
        run: |
          set -ex
          docker exec "${CONTAINER_NAME}" bash -lc "bash scripts/ci/sglang_benchmark_workflow.sh launch \"${MODEL_NAME}\" \"${MODEL_PATH}\" \"${MODEL_TP}\" 1 45"

      - name: Run GSM8K accuracy evaluation
        if: ${{ matrix.job_mode == 'accuracy' }}
        timeout-minutes: 45
        run: |
          set -ex
          docker exec "${CONTAINER_NAME}" bash -lc "bash scripts/ci/sglang_benchmark_workflow.sh evaluation \"${MODEL_NAME}\" \"${MODEL_PATH}\" \"${MODEL_TP}\" 1"

      - name: Collect GSM8K accuracy summary
        if: ${{ success() && matrix.job_mode == 'accuracy' }}
        run: |
          rm -rf accuracy_test_results
          docker cp "${CONTAINER_NAME}:/sglang-checkout/accuracy_test_results" ./accuracy_test_results
          python3 <<'PY'
          import json
          import os
          import pathlib
          import sys

          result_files = sorted(
              pathlib.Path("accuracy_test_results").glob("*_gsm8k_results.json"),
              key=lambda p: p.stat().st_mtime,
              reverse=True,
          )
          if not result_files:
              print("ERROR: No GSM8K results JSON file found in accuracy_test_results/", file=sys.stderr)
              raise SystemExit(2)

          result_file = result_files[0]
          data = json.loads(result_file.read_text())
          score = data["results"]["gsm8k"]["exact_match,flexible-extract"]

          print(f"RESULT_FILE: {result_file}")
          print(f"GSM8K flexible extract score: {score}")

          summary_path = pathlib.Path(os.environ["GITHUB_STEP_SUMMARY"])
          with summary_path.open("a", encoding="utf-8") as f:
              f.write("### GSM8K Accuracy Summary\n")
              f.write(f"- Result file: `{result_file}`\n")
              f.write(f"- Score: `{score:.4f}`\n")
          PY

      - name: Run pure text benchmark
        if: ${{ matrix.job_mode == 'accuracy' }}
        timeout-minutes: 30
        run: |
          set -ex
          docker exec "${CONTAINER_NAME}" bash -lc "bash scripts/ci/sglang_benchmark_workflow.sh pure_text \"${MODEL_NAME}\" \"${MODEL_PATH}\" \"${MODEL_TP}\" 1"

      - name: Run load tests
        if: ${{ matrix.job_mode == 'benchmark' }}
        timeout-minutes: 120
        run: |
          set -ex
          docker exec "${CONTAINER_NAME}" bash -lc "bash scripts/ci/sglang_benchmark_workflow.sh ${BENCHMARK_TARGET} \"${MODEL_NAME}\" \"${MODEL_PATH}\" \"${MODEL_TP}\" 1 45"

      - name: Collect benchmark summary
        if: ${{ always() && (matrix.job_mode == 'benchmark' || matrix.job_mode == 'accuracy') }}
        run: |
          python3 <<'PY'
          import os
          import pathlib
          import shutil
          import subprocess

          results_dir = pathlib.Path(os.environ["SGLANG_BENCHMARK_RESULTS_DIR"])
          if results_dir.exists():
              shutil.rmtree(results_dir)

          subprocess.run(
              [
                  "docker",
                  "cp",
                  f"{os.environ['CONTAINER_NAME']}:/sglang-checkout/{results_dir}",
                  str(results_dir),
              ],
              check=False,
          )

          if not results_dir.exists():
              print(f"No benchmark results copied from container: {results_dir}")
              raise SystemExit(0)

          log_files = sorted(results_dir.glob("*.log"))
          if not log_files:
              print(f"No benchmark logs found in {results_dir}")
              raise SystemExit(0)

          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if not summary_path:
              for log_file in log_files:
                  print(f"Collected benchmark log: {log_file}")
              raise SystemExit(0)

          with open(summary_path, "a", encoding="utf-8") as f:
              f.write("### Qwen3.5 Load Test Summary\n")
              target = os.environ.get("BENCHMARK_TARGET", "pure_text")
              if target == "accuracy":
                  target = "pure_text"
              elif target == "load_test":
                  target = "pure_text, concurrency, request_rate"
              f.write(f"- Target: `{target}`\n")
              for log_file in log_files:
                  f.write(f"- Log: `{log_file}`\n")
                  f.write("```text\n")
                  tail_lines = log_file.read_text(encoding="utf-8", errors="replace").splitlines()[-20:]
                  if tail_lines:
                      f.write("\n".join(tail_lines))
                      f.write("\n")
                  f.write("```\n")
          PY

      - name: Clean up
        if: always()
        run: |
          set -euo pipefail

          # Only remove resources created by this workflow job. Do not prune or
          # delete other images/containers on the shared CI runner.
          echo "Stopping and removing CI container: ${CONTAINER_NAME}"
          docker rm -f "${CONTAINER_NAME}" || true

          echo "Removing CI-built image for this job: ${LOCAL_IMAGE_NAME}"
          docker rmi -f "${LOCAL_IMAGE_NAME}" || true

          rm -f Dockerfile.mod aiter_update.sh || true

          echo "CI cleanup complete (container + image for this job only)."
